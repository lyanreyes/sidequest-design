<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideQuest UI Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0A090D; --header: #0C0A11; --panel: #100E13; --card: #151219; --card-purple: #1F162B; --input: #141217; --border: #221E28; --border-strong: #2E2936; --primary: #9CFF27; --primary-hover: #86E21A; --on-primary: #0A090D; --accent: #743BD2; --accent-text: #A985F7; --accent-soft: #2A1E3A; --avatar-lime: #B8FF62; --avatar-blue: #7EC9FF; --text: #F5F3F7; --text-muted: #8E8896; --text-subtle: #837D8C; --success: #4ADE80; --error: #F87171; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #050508; color: #F4F4F6; font-family: "DM Sans", sans-serif; padding: 48px 32px; }
  h1.page { font-size: 40px; font-weight: 800; margin-bottom: 8px; }
  p.lead { color: #A1A1B0; margin-bottom: 40px; max-width: 720px; line-height: 1.5; }
  h2.flow { font-size: 22px; font-weight: 700; margin: 56px 0 20px; color: #9CFF27; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .shot { display: flex; flex-direction: column; gap: 10px; }
  .shot > .label { font-size: 13px; color: #A1A1B0; font-weight: 600; }
  .phone { border-radius: 40px; box-shadow: 0 0 0 8px #1B1B22, 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }

</style>

<body>
<h1 class="page">SideQuest · UI Design</h1>
<p class="lead">Preview of the Figma file generated by the SideQuest plugin: design system, then the start flow (log in and register), worker flow, client flow, and shared screens. Mobile frames are 390 × 844.</p>
<div id="ds"></div>
<div id="screens"></div>
<script>
// SideQuest design tokens — single source of truth for the Figma plugin and the HTML preview.

const TOKENS = {

    // name, hex, description — sampled from the team's SideQuest screens
    ["bg", "#0A090D", "App background"],
    ["header", "#0C0A11", "Top bars"],
    ["panel", "#100E13", "Main panels that group a section"],
    ["card", "#151219", "Cards inside panels, nav bar"],
    ["card-purple", "#1F162B", "Highlighted cards: active quest, profile hero"],
    ["input", "#141217", "Input and search fields"],
    ["border", "#221E28", "Panel, card and input borders"],
    ["border-strong", "#2E2936", "Outlined buttons, chips"],
    ["primary", "#9CFF27", "Lime — primary actions, active tab, ratings"],
    ["primary-hover", "#86E21A", "Primary hover/pressed"],
    ["on-primary", "#0A090D", "Text and icons on lime"],
    ["accent", "#743BD2", "Purple fill — avatars, sent messages, Client role"],
    ["accent-text", "#A985F7", "Purple text: eyebrows, links, task names"],
    ["accent-soft", "#2A1E3A", "Purple tint: secondary buttons, skill chips, active switch"],
    ["avatar-lime", "#B8FF62", "Avatar fill"],
    ["avatar-blue", "#7EC9FF", "Avatar fill"],
    ["text", "#F5F3F7", "Primary text"],
    ["text-muted", "#8E8896", "Secondary text"],
    ["text-subtle", "#837D8C", "Placeholders and hints"],
    ["success", "#4ADE80", "Verified, payment released"],
    ["error", "#F87171", "Errors"],
  ],
  // name, size, lineHeight, weight, letterSpacing(%), family
  type: [
    ["Display", 32, 38, "Bold", -1, "Manrope"],
    ["H1", 28, 32, "SemiBold", -1, "Manrope"],
    ["H2", 20, 26, "SemiBold", -0.5, "Manrope"],
    ["H3", 17, 22, "Bold", 0, "Manrope"],
    ["Brand", 16, 20, "Bold", 0, "Manrope"],
    ["Metric", 22, 28, "Bold", -0.5, "DM Sans"],
    ["Title", 14, 18, "Bold", 0, "DM Sans"],
    ["Button", 13, 16, "SemiBold", 0, "DM Sans"],
    ["Body", 13, 18, "Regular", 0, "DM Sans"],
    ["Body Small", 12, 16, "Regular", 0, "DM Sans"],
    ["Caption", 10, 14, "Medium", 0, "DM Sans"],
    ["Overline", 9, 12, "Bold", 8, "DM Sans"],
  ],
  spacing: [4, 6, 8, 10, 12, 14, 16, 20, 24, 32],
  radius: [["chip", 999], ["control", 10], ["card", 14], ["panel", 16], ["avatar", 999]],
};

const FAMILIES = ["Manrope", "DM Sans"];
const WEIGHT_CSS = { Regular: 400, Medium: 500, SemiBold: 600, Bold: 700, ExtraBold: 800 };

function colorHex(name) {
  const c = TOKENS.colors.find((c) => c[0] === name);
  if (!c) throw new Error("Unknown color token: " + name);
  return c[1];
}
function typeStyle(name) {
  const t = TOKENS.type.find((t) => t[0] === name);
  if (!t) throw new Error("Unknown type style: " + name);
  return { name: t[0], size: t[1], line: t[2], weight: t[3], tracking: t[4], family: t[5] };
}

// ---------- Icons (24x24, stroke 2, round) ----------
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  message: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  bell: '<path d="M6 9a6 6 0 1 1 12 0c0 6 3 7 3 7H3s3-1 3-7M10 20h4"/>',
  pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chevronRight: '<path d="m9 6 6 6-6 6"/>',
  chevronLeft: '<path d="m15 6-6 6 6 6"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  arrowRight: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7"/>',
  wallet: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  filter: '<path d="M4 6h16M7 12h10M10 18h4"/>',
  navigation: '<path d="m3 11 18-8-8 18-2-8z"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  idCard: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16a3 3 0 0 1 6 0M15 10h3M15 14h3"/>',
  package: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
  laptop: '<rect x="4" y="5" width="16" height="11" rx="1"/><path d="M2 19h20"/>',
  paw: '<circle cx="7" cy="10" r="1.6"/><circle cx="11" cy="6.5" r="1.6"/><circle cx="15.5" cy="7.5" r="1.6"/><circle cx="18" cy="11.5" r="1.6"/><path d="M8.5 17.5c0-2.5 2-4.5 4-4.5s3.5 1.5 3.5 3.5-1.5 2.5-3.5 2.5-4 .5-4-1.5z"/>',
  sparkle: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  logout: '<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
};

function iconSvg(name, hex, size, filled) {
  const body = ICONS[name];
  if (!body) throw new Error("Unknown icon: " + name);
  const paint = filled
    ? `fill="${hex}" stroke="${hex}" stroke-width="1.5"`
    : `fill="none" stroke="${hex}" stroke-width="2"`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" ${paint} stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

// Stylized map used for gig location and live tracking
function mapSvg(w, h, opts) {
  opts = opts || {};
  const bg = colorHex("input"), road = "#2A2531", block = "#1A1720";
  const lime = colorHex("primary"), violet = colorHex("accent");
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  s += `<rect width="${w}" height="${h}" fill="${bg}"/>`;
  const blocks = [[0.05, 0.08, 0.25, 0.3], [0.38, 0.06, 0.22, 0.26], [0.7, 0.1, 0.26, 0.22], [0.08, 0.55, 0.3, 0.35], [0.5, 0.48, 0.18, 0.4], [0.76, 0.5, 0.2, 0.4]];
  for (const b of blocks) s += `<rect x="${b[0] * w}" y="${b[1] * h}" width="${b[2] * w}" height="${b[3] * h}" rx="6" fill="${block}"/>`;
  s += `<path d="M0 ${h * 0.45} H${w} M${w * 0.34} 0 V${h} M${w * 0.68} 0 L${w * 0.72} ${h}" stroke="${road}" stroke-width="10" fill="none"/>`;
  if (opts.route) {
    s += `<path d="M${w * 0.18} ${h * 0.75} L${w * 0.34} ${h * 0.75} L${w * 0.34} ${h * 0.45} L${w * 0.7} ${h * 0.45} L${w * 0.7} ${h * 0.25}" stroke="${violet}" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round" fill="none"/>`;
    s += `<circle cx="${w * 0.34}" cy="${h * 0.55}" r="14" fill="${violet}" fill-opacity="0.25"/><circle cx="${w * 0.34}" cy="${h * 0.55}" r="7" fill="${violet}" stroke="#fff" stroke-width="2"/>`;
  }
  const px = w * (opts.route ? 0.7 : 0.55), py = h * (opts.route ? 0.25 : 0.42);
  s += `<circle cx="${px}" cy="${py}" r="26" fill="${lime}" fill-opacity="0.15"/>`;
  s += `<path transform="translate(${px - 14} ${py - 30}) scale(1.17)" d="M12 23s-9-7.6-9-13.5a9 9 0 1 1 18 0C21 15.4 12 23 12 23z" fill="${lime}"/><circle cx="${px}" cy="${py - 19}" r="4" fill="${colorHex("on-primary")}"/>`;
  return s + "</svg>";
}

function statusBarSvg(hex) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="68" height="12" viewBox="0 0 68 12" fill="${hex}"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M28 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM30.8 6.6a5 5 0 0 1 6.4 0L34 10z"/><rect x="45" y="0.5" width="20" height="11" rx="3" fill="none" stroke="${hex}" stroke-opacity="0.5"/><rect x="47" y="2.5" width="14" height="7" rx="1.5"/><rect x="66" y="4" width="1.5" height="4" rx="0.7" fill-opacity="0.5"/></svg>`;
}

// Sample QR code graphic (placeholder — the real one comes from PayMongo's QR Ph API at payment time)
function qrSvg(size, seed) {
  const n = 29, m = size / n;
  let x = seed || 7, s = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#FFFFFF"/>`;
  const rnd = () => ((x = (x * 1103515245 + 12345) % 2147483648) / 2147483648);
  const finder = (r, c) => r < 8 && c < 8 || r < 8 && c >= n - 8 || r >= n - 8 && c < 8;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (finder(r, c)) continue;
    if (r >= 12 && r <= 16 && c >= 12 && c <= 16) continue; // centre logo space
    if (rnd() < 0.5) s += `<rect x="${(c * m).toFixed(2)}" y="${(r * m).toFixed(2)}" width="${m.toFixed(2)}" height="${m.toFixed(2)}" fill="#0A090D"/>`;
  }
  for (const [r, c] of [[0, 0], [0, n - 7], [n - 7, 0]]) {
    s += `<rect x="${c * m}" y="${r * m}" width="${7 * m}" height="${7 * m}" fill="#0A090D"/><rect x="${(c + 1) * m}" y="${(r + 1) * m}" width="${5 * m}" height="${5 * m}" fill="#FFFFFF"/><rect x="${(c + 2) * m}" y="${(r + 2) * m}" width="${3 * m}" height="${3 * m}" fill="#0A090D"/>`;
  }
  const c0 = 12.3 * m, w0 = 4.4 * m;
  s += `<rect x="${c0}" y="${c0}" width="${w0}" height="${w0}" rx="${m}" fill="${colorHex("primary")}"/><rect x="${c0 + 1.4 * m}" y="${c0 + 1.4 * m}" width="${1.6 * m}" height="${1.6 * m}" rx="${0.4 * m}" fill="#0A090D"/>`;
  return s + "</svg>";
}

// SideQuest screens, following the team's Figma layouts (panels, purple eyebrows, lime actions).
// Layout tree: frames use auto layout ("V"/"H"); sizes are "fill", "hug" or a number.
// `to` = prototype link target (screen name, or "BACK").

const F = (p, children) => Object.assign({ t: "frame", children: children || [] }, p);
const V = (p, c) => F(Object.assign({ layout: "V" }, p), c);
const H = (p, c) => F(Object.assign({ layout: "H", align: "center" }, p), c);
const Tx = (text, style, color, p) => Object.assign({ t: "text", text, style, color: color || "text" }, p);
const Ic = (name, color, size, filled) => ({ t: "icon", name, color: color || "text", size: size || 18, filled: !!filled });
const Svg = (name, svg, w, h, p) => Object.assign({ t: "svg", name, svg, w, h }, p);
const Btn = (label, variant, p) => Object.assign({ t: "button", label, variant: variant || "Primary", state: "Default" }, p);
const Divider = () => F({ name: "Divider", w: "fill", h: 1, fill: "border" });

const W = 390, HGT = 844;
const S = {
  login: "01 · Log in", signup: "02 · Sign up", verify: "03 · Verify number",
  discover: "04 · Discover (Worker)", gig: "05 · Gig details", quests: "06 · My quests", earnings: "07 · Earnings",
  client: "08 · Home (Client)", post: "09 · Post a task", offers: "10 · Worker offers", pay: "11 · Pay with GCash",
  qr: "12 · Scan GCash QR", track: "13 · Track task", review: "14 · Rate & review",
  messages: "15 · Messages", chat: "16 · Conversation", profile: "17 · Profile",
};

// ---------- building blocks ----------
function statusBar() {
  return H({ name: "Status bar", w: W, h: 44, pad: [0, 28], justify: "between", fill: "bg", x: 0, y: 0 }, [
    Tx("9:41", "Button", "text", { w: "hug" }),
    Svg("Status icons", statusBarSvg(colorHex("text")), 68, 12),
  ]);
}

function logo(size) {
  size = size || 34;
  return H({ name: "Logo", w: size, h: size, fill: "primary", radius: size * 0.26, justify: "center" }, [
    Tx("S", size > 40 ? "H2" : "Brand", "on-primary", { w: "hug" }),
  ]);
}

function iconBtn(name, o) {
  o = o || {};
  return H({ name: "Icon button / " + name, w: 36, h: 36, stroke: "border", radius: 10, justify: "center", to: o.to }, [Ic(name, o.color || "text", 18)].concat(
    o.dot ? [F({ name: "Dot", w: 6, h: 6, fill: "primary", radius: 3, x: 23, y: 8, abs: true })] : []));
}

function brandBar() {
  return V({ name: "Brand bar", w: W, gap: 0, fill: "header", x: 0, y: 44 }, [
    H({ name: "Bar", w: "fill", h: 60, pad: [0, 20], gap: 10 }, [logo(30), Tx("SideQuest", "Brand", "text", { w: "hug" })]),
    Divider(),
  ]);
}

function appHeader() {
  return H({ name: "App header", w: "fill", justify: "between" }, [
    H({ name: "Brand + area", w: "hug", gap: 12 }, [
      logo(34),
      Ic("pin", "primary", 16),
      V({ name: "Area", w: "hug", gap: 1 }, [
        Tx("YOUR AREA", "Overline", "text-muted", { w: "hug" }),
        H({ name: "Area picker", w: "hug", gap: 6 }, [Tx("Tanauan City", "Title", "text", { w: "hug" }), Ic("chevronDown", "text-muted", 14)]),
      ]),
    ]),
    iconBtn("bell", { dot: true }),
  ]);
}

function backHeader(title, right) {
  return H({ name: "Top bar", w: "fill", justify: "between" }, [
    iconBtn("chevronLeft", { to: "BACK" }),
    Tx(title, "H3", "text", { w: "hug" }),
    right || F({ name: "Spacer", w: 36, h: 36 }),
  ]);
}

function heading(eyebrow, title, sub, right) {
  const text = V({ name: "Heading", w: right ? "fill" : undefined, gap: 6 }, [
    Tx(eyebrow, "Overline", "accent-text"),
    Tx(title, "H1", "text"),
    sub ? Tx(sub, "Body Small", "text-muted") : null,
  ].filter(Boolean));
  return right ? H({ name: "Heading row", w: "fill", gap: 12, align: "end" }, [text, right]) : text;
}

function panel(p, children) {
  return V(Object.assign({ name: "Panel", pad: 16, gap: 14, fill: "panel", stroke: "border", radius: 16 }, p), children);
}
function card(p, children) {
  return V(Object.assign({ name: "Card", pad: 14, gap: 12, fill: "card", stroke: "border", radius: 14 }, p), children);
}

function segmented(active) {
  const item = (label, to) => H({ name: label, w: "fill", h: 34, radius: 9, justify: "center", fill: active === label ? "accent-soft" : null, to: active === label ? undefined : to }, [
    Tx(label, "Button", active === label ? "text" : "text-muted", { w: "hug" }),
  ]);
  return H({ name: "Role switcher", w: "fill", pad: 4, gap: 4, fill: "panel", stroke: "border", radius: 12 }, [
    item("Worker", S.discover), item("Client", S.client),
  ]);
}

function input(label, placeholder, o) {
  o = o || {};
  return V({ name: "Input / " + label, gap: 8 }, [
    Tx(label, "Button", "text"),
    H({ name: "Field", w: "fill", h: 44, pad: [0, 14], gap: 10, fill: "input", radius: 10,
      stroke: o.error ? "error" : o.focus ? "accent-text" : "border", strokeW: o.focus || o.error ? 2 : 1 }, [
      o.icon ? Ic(o.icon, "text-subtle", 16) : null,
      Tx(o.value || placeholder, "Body", o.value ? "text" : "text-subtle", { w: "fill" }),
      o.trailing ? Ic(o.trailing, "text-muted", 18) : null,
    ].filter(Boolean)),
    o.help ? Tx(o.help, "Caption", o.error ? "error" : "text-muted") : null,
  ].filter(Boolean));
}

function chip(label, active, to) {
  return H({ name: "Chip / " + label, w: "hug", h: 30, pad: [0, 12], radius: 999, fill: active ? "primary" : "card", stroke: active ? null : "border-strong", to }, [
    Tx(label, "Body Small", active ? "on-primary" : "text-muted", { w: "hug" }),
  ]);
}
function skillChip(label) {
  return H({ name: "Skill / " + label, w: "hug", h: 26, pad: [0, 10], radius: 999, fill: "card", stroke: "border-strong" }, [Tx(label, "Caption", "accent-text", { w: "hug" })]);
}

function avatar(initials, color, size) {
  size = size || 40;
  const dark = color === "accent";
  return H({ name: "Avatar / " + initials, w: size, h: size, radius: size / 2, fill: color || "avatar-lime", justify: "center" }, [
    Tx(initials, size >= 56 ? "H3" : "Button", dark ? "text" : "on-primary", { w: "hug" }),
  ]);
}

function smallBtn(label, kind, to) {
  const lime = kind === "lime";
  return H({ name: "Button / small / " + label, w: "hug", h: 28, pad: [0, 12], radius: 8, justify: "center", fill: lime ? "primary" : null, stroke: lime ? null : "border-strong", to }, [
    Tx(label, "Caption", lime ? "on-primary" : "accent-text", { w: "hug" }),
  ]);
}

function gigCard(g) {
  return card({ name: "Gig card / " + g.title, to: g.to }, [
    H({ name: "Top", w: "fill", gap: 12, align: "start" }, [
      avatar(g.initials, g.color, 44),
      V({ name: "Info", w: "fill", gap: 6 }, [
        H({ name: "Eyebrow", w: "fill", gap: 6 }, [Tx(g.category, "Overline", "accent-text", { w: "hug" }), Ic("pin", "text-muted", 11), Tx(g.distance, "Overline", "text-muted", { w: "hug" })]),
        Tx(g.title, "Title", "text"),
        H({ name: "Client", w: "fill", gap: 6 }, [Tx(g.client, "Caption", "text-muted", { w: "hug" }), Ic("star", "primary", 12), Tx(g.rating, "Caption", "text", { w: "hug" })]),
        H({ name: "When", w: "fill", gap: 6 }, [Ic("clock", "text-muted", 12), Tx(g.time, "Caption", "text-muted", { w: "hug" })]),
      ]),

function screen(name, content, o) {

  const kids = [V({ name: "Content", w: W, gap: o.gap || 18, pad: [8, 20, o.nav || o.cta ? 110 : 24, 20], x: 0, y: 44 }, content), statusBar()];

}

  const dot = state === "done" ? "primary" : state === "now" ? "accent-text" : null;
  return H({ name: "Step / " + title, w: "fill", gap: 12, align: "start" }, [

// Button visuals per variant/state (used by both renderers)
const BUTTON_VARIANTS = ["Primary", "Purple", "Outline"];
const BUTTON_STATES = ["Default", "Hover", "Disabled", "Focus"];
const BUTTON_LABEL = { Primary: "Log in", Purple: "Message", Outline: "Edit profile" };
function buttonLook(variant, state) {
  const look = {
    Primary: { fill: state === "Hover" ? "primary-hover" : "primary", text: "on-primary", stroke: null },
    Purple: { fill: state === "Hover" ? "card-purple" : "accent-soft", text: "accent-text", stroke: state === "Hover" ? "accent-text" : null },
    Outline: { fill: state === "Hover" ? "card" : null, text: "text", stroke: "border-strong" },
  }[variant];
  if (state === "Disabled") look.opacity = 0.35;
  if (state === "Focus") look.ring = "accent-text";
  return look;
}

// Renders the layout tree to HTML so the design can be previewed in a browser.

function hRender(node, parentLayout) {
  if (node.t === "text") return hText(node, parentLayout);
  if (node.t === "icon") return hSvgBox(iconSvg(node.name, colorHex(node.color), node.size, node.filled), node.size, node.size, node, parentLayout);
  if (node.t === "svg") return hSvgBox(node.svg, node.w, node.h, node, parentLayout);
  if (node.t === "button") return hButton(node.variant, node.state, node.label, node.w, parentLayout);
  if (node.t === "buttonSet") return hButtonSet();
  return hFrame(node, parentLayout);
}

function hSize(el, node, parentLayout, defW, defH) {
  const w = node.w !== undefined ? node.w : defW;
  const h = node.h !== undefined ? node.h : defH;
  if (typeof w === "number") { el.style.width = w + "px"; el.style.flexShrink = "0"; }
  else if (w === "fill") {
    if (parentLayout === "H") { el.style.flex = "1 1 0"; el.style.minWidth = "0"; } else el.style.alignSelf = "stretch";
  }
  if (typeof h === "number") { el.style.height = h + "px"; el.style.flexShrink = "0"; }
  else if (h === "fill") {
    if (parentLayout === "V") el.style.flex = "1 1 0"; else el.style.alignSelf = "stretch";
  }
  const absolute = parentLayout === null || node.abs;
  if (absolute && (node.x !== undefined || node.y !== undefined)) {
    el.style.position = "absolute";
    el.style.left = (node.x || 0) + "px";
    if (node.y === "bottom") el.style.bottom = "0"; else el.style.top = (node.y || 0) + "px";
  }
}

function hPad(p) {
  if (p === undefined) return "0";
  if (typeof p === "number") return p + "px";
  if (p.length === 2) return `${p[0]}px ${p[1]}px`;
  return p.map((v) => v + "px").join(" ");
}

const ALIGN = { start: "flex-start", center: "center", end: "flex-end" };
const JUSTIFY = { start: "flex-start", center: "center", end: "flex-end", between: "space-between" };

function hFrame(node, parentLayout) {
  const el = document.createElement("div");
  el.className = "f";
  el.title = node.name || "";
  const layout = node.layout || null;
  if (layout) {
    el.style.display = "flex";
    el.style.flexDirection = layout === "V" ? "column" : "row";
    el.style.gap = (node.gap || 0) + "px";
    el.style.alignItems = ALIGN[node.align || "start"];
    el.style.justifyContent = JUSTIFY[node.justify || "start"];
  }
  el.style.padding = hPad(node.pad);
  if (node.fill) el.style.background = `var(--${node.fill})`;
  const shadows = [];
  if (node.stroke) shadows.push(`inset 0 0 0 ${node.strokeW || 1}px var(--${node.stroke})`);
  if (node.ring) shadows.push(`0 0 0 3px var(--${node.ring})`);
  if (shadows.length) el.style.boxShadow = shadows.join(",");
  if (node.radius) el.style.borderRadius = node.radius + "px";
  if (node.clip) el.style.overflow = "hidden";
  if (node.opacity !== undefined) el.style.opacity = node.opacity;
  if (node.to) el.style.cursor = "pointer";
  el.style.position = "relative";
  const defW = parentLayout === "V" ? "fill" : "hug";
  hSize(el, node, parentLayout, defW, layout ? "hug" : undefined);
  for (const c of node.children) el.appendChild(hRender(c, layout));
  return el;
}

function hTextCss(el, styleName, color) {
  const s = typeStyle(styleName);
  el.style.fontFamily = `"${s.family}", sans-serif`;
  el.style.fontSize = s.size + "px";
  el.style.lineHeight = s.line + "px";
  el.style.fontWeight = WEIGHT_CSS[s.weight];
  el.style.letterSpacing = s.tracking / 100 + "em";
  el.style.color = `var(--${color})`;
}

function hText(node, parentLayout) {
  const el = document.createElement("div");
  el.textContent = node.text;
  hTextCss(el, node.style, node.color);
  el.style.textAlign = node.align || "left";
  const w = node.w !== undefined ? node.w : parentLayout === "V" ? "fill" : "hug";
  if (w === "hug") el.style.whiteSpace = "nowrap";
  hSize(el, Object.assign({}, node, { w }), parentLayout);
  return el;
}

function hSvgBox(svg, w, h, node, parentLayout) {
  const el = document.createElement("div");
  el.innerHTML = svg;
  el.style.display = "flex";
  hSize(el, Object.assign({}, node, { w, h }), parentLayout);
  return el;
}

function hButton(variant, state, label, w, parentLayout) {
  const look = buttonLook(variant, state);
  const node = { t: "frame", name: "Button", layout: "H", h: 44, pad: [0, 18], radius: 10, justify: "center", align: "center",
    fill: look.fill, stroke: look.stroke, ring: look.ring, opacity: look.opacity, w: w === undefined ? (parentLayout === "H" ? "hug" : "fill") : w,
    children: [Tx(label, "Button", look.text, { w: "hug" })] };
  return hFrame(node, parentLayout);
}

function hButtonSet() {
  const node = V({ name: "Button set", gap: 20 }, BUTTON_VARIANTS.map((v) => H({ name: v, w: "fill", gap: 24, align: "start" }, BUTTON_STATES.map((s) =>
    V({ name: s, w: 200, gap: 10, align: "center" }, [Btn(BUTTON_LABEL[v], v, { state: s, w: "fill" }), Tx(`${v} · ${s}`, "Caption", "text-muted", { w: "hug" })])))));
  return hFrame(node, "V");
}

const only = new URLSearchParams(location.search).get("only");
if (only) {
  document.body.innerHTML = ""; document.body.style.padding = "0";
  const node = only === "ds" ? DESIGN_SYSTEM : SCREENS.find((s) => s.name.startsWith(only));
  document.body.appendChild(hRender(node, undefined));
} else {
document.getElementById("ds").appendChild(hRender(DESIGN_SYSTEM, undefined));
}
const host = document.getElementById("screens");
if (!only) for (const [key, title] of FLOWS) {
  const h = document.createElement("h2"); h.className = "flow"; h.textContent = title; host.appendChild(h);
  const row = document.createElement("div"); row.className = "row"; host.appendChild(row);
  for (const s of SCREENS.filter((s) => s.flow === key)) {
    const wrap = document.createElement("div"); wrap.className = "shot";
    const label = document.createElement("div"); label.className = "label"; label.textContent = s.name;
    const phone = hRender(s, undefined); phone.classList.add("phone");
    wrap.appendChild(label); wrap.appendChild(phone); row.appendChild(wrap);
  }
}
